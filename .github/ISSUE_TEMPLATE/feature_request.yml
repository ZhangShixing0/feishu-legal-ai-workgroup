name: 功能建议
description: 提议新的工作流、模板、治理或可靠性能力。
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前由谁、在什么场景、为什么会遇到问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明输入、输出、人工确认点和失败处理。
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: 是否改变数据或权限边界
      options:
        - 是
        - 否
        - 不确定
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出可测试的完成条件。
    validations:
      required: true
