<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>律书生成台</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 3 1.2 4.1L17 9l-3.8 1.9L12 15l-1.2-4.1L7 9l3.8-1.9L12 3zM5 15l.7 2.3L8 18l-2.3.7L5 21l-.7-2.3L2 18l2.3-.7L5 15zM19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14z"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.7 2.7L16.5 9"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M10.3 3.8 2.4 18a2 2 0 0 0 1.8 3h15.6a2 2 0 0 0 1.8-3L13.7 3.8a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M18.2 9A7 7 0 0 0 6.3 6.3L4 9M5.8 15A7 7 0 0 0 17.7 17.7L20 15"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></symbol>
  </svg>

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">律</div>
      <div>
        <div class="brand-name">律书生成台</div>
        <div class="brand-subtitle" id="brandSubtitle">法律文书离线生成工具</div>
      </div>
    </div>
    <div class="header-meta">
      <span class="privacy-badge" id="privacyBadge"><svg><use href="#icon-lock"/></svg>离线 · 仅本机处理</span>
      <span class="version-badge" id="versionBadge">验证版 0.6.0</span>
    </div>
  </header>

  <main class="workspace">
    <section class="input-pane" aria-labelledby="input-title">
      <div class="pane-topbar">
        <div>
          <span class="eyebrow">步骤 1</span>
          <h1 id="input-title">录入案件信息</h1>
        </div>
        <span class="save-state" id="saveState">演示数据已载入</span>
      </div>

      <div class="input-scroll">
        <section class="template-card" aria-labelledby="template-title">
          <div class="template-icon"><svg><use href="#icon-file"/></svg></div>
          <div class="template-copy">
            <label id="template-title" for="templateSelect">起诉状类型</label>
            <select id="templateSelect" disabled>
              <option>金融借款合同纠纷民事起诉状</option>
            </select>
            <p>完整案件信息版：支持Excel字段和黄色标记模板</p>
          </div>
        </section>

        <div class="mode-tabs" role="tablist" aria-label="信息录入方式">
          <button class="mode-tab is-active" role="tab" aria-selected="true">结构化录入</button>
          <button class="mode-tab" role="tab" aria-selected="false" disabled>上传Word · 后续</button>
        </div>

        <section class="paste-card" aria-labelledby="paste-title">
          <div class="section-heading compact">
            <div>
              <h2 id="paste-title">粘贴已有信息</h2>
              <p>支持连续文本、多个字段同一行或不规则换行；系统按字段标签自动断句，结果仍可手工修改。</p>
            </div>
            <span class="local-chip">本地规则识别</span>
          </div>
          <label class="sr-only" for="pasteInput">粘贴案件信息</label>
          <textarea id="pasteInput" rows="7" placeholder="可直接粘贴连续文本，无需手工换行。例如：&#10;客户编号&quot;914...&quot;贷款合同编号&quot;420...&quot;被告姓名&quot;曹某&quot;被告出生日期&quot;1979-06-04&quot;……"></textarea>
          <div class="paste-actions">
            <button class="button secondary" id="recognizeButton" type="button">
              <svg><use href="#icon-spark"/></svg>识别并填入
            </button>
            <button class="text-button" id="loadExampleButton" type="button">载入演示数据</button>
            <button class="text-button danger-text" id="clearButton" type="button">
              <svg><use href="#icon-trash"/></svg>清空
            </button>
          </div>
          <p class="recognize-result" id="recognizeResult" role="status" aria-live="polite"></p>
        </section>

        <div id="formGroups" class="form-groups" aria-live="polite">
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
        </div>
      </div>

      <div class="generate-bar">
        <div class="generate-copy">
          <span class="status-dot"></span>
          <span id="validationSummary">正在载入字段…</span>
        </div>
        <button id="generateButton" class="button primary" type="button" disabled>
          <svg><use href="#icon-eye"/></svg>
          <span>生成预览</span>
        </button>
      </div>
    </section>

    <section class="preview-pane" aria-labelledby="preview-title">
      <div class="preview-toolbar">
        <div>
          <span class="eyebrow">步骤 2</span>
          <h2 id="preview-title">Word版式预览</h2>
        </div>
        <div class="preview-actions">
          <span class="preview-status" id="previewStatus">待生成</span>
          <a class="button ghost is-disabled" id="downloadDocx" href="#" aria-disabled="true">
            <svg><use href="#icon-download"/></svg>Word
          </a>
        </div>
      </div>

      <div class="preview-stage" id="previewStage">
        <div class="empty-preview" id="emptyPreview">
          <div class="empty-illustration">
            <svg><use href="#icon-file"/></svg>
            <span class="highlight-line one"></span>
            <span class="highlight-line two"></span>
          </div>
          <h3>右侧尚未生成文书</h3>
          <p>填写或确认左侧信息后，点击“生成预览”。右侧将显示与Word内容、表格一致的完整文书。</p>
          <div class="empty-note" id="processingNote"><svg><use href="#icon-lock"/></svg>整个过程仅在本机完成</div>
        </div>
        <div class="loading-preview" id="loadingPreview" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <h3>正在生成Word</h3>
          <p id="loadingCopy">仅在本机填充模板，不再等待PDF转换。</p>
        </div>
        <div id="htmlPreview" class="html-preview" aria-label="起诉状Word版式预览" hidden></div>
      </div>

      <aside class="message-panel" id="messagePanel" hidden aria-live="polite"></aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/text-parser.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
